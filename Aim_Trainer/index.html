<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Aim Trainer — Emo Games</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--nc:#00f0ff;--np:#b44aff;--ng:#39ff14;--nr:#ff3355;--ny:#ffe600;--no:#ff6b00;--bg:#080a12}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Inter',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;user-select:none}
body::before{content:'';position:fixed;inset:0;z-index:-1;background-image:radial-gradient(circle at 50% 50%,rgba(255,51,85,.03) 0%,transparent 70%),linear-gradient(rgba(255,51,85,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,51,85,.02) 1px,transparent 1px);background-size:100%,35px 35px,35px 35px}
#hud{width:100%;display:flex;justify-content:space-around;align-items:center;padding:14px 20px;background:linear-gradient(180deg,rgba(8,10,18,.95),transparent);z-index:10}
.hi{text-align:center}
.hl{font:600 9px/1 'Orbitron',monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:5px}
.hv{font:900 20px/1 'Orbitron',monospace;color:var(--nr);text-shadow:0 0 10px rgba(255,51,85,.5)}
.hv.g{color:var(--ng);text-shadow:0 0 10px rgba(57,255,20,.5)}
.hv.c{color:var(--nc);text-shadow:0 0 10px rgba(0,240,255,.5)}
.hv.y{color:var(--ny);text-shadow:0 0 10px rgba(255,230,0,.5)}
#arena{position:relative;flex:1;width:100%;cursor:crosshair;overflow:hidden}
.target{position:absolute;border-radius:50%;cursor:crosshair;transition:transform .08s;animation:popIn .15s ease-out}
.target:hover{transform:scale(1.1)}
.target .ring{position:absolute;inset:0;border-radius:50%;border:2px solid;opacity:.5;animation:pulse 1s infinite}
@keyframes popIn{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.3);opacity:0}}
.hit-marker{position:absolute;font:900 16px/1 'Orbitron',monospace;pointer-events:none;animation:hitFloat .5s forwards}
@keyframes hitFloat{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
.ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,5,10,.92);backdrop-filter:blur(6px);text-align:center;padding:24px;transition:opacity .3s}
.ov.h{opacity:0;pointer-events:none}
.ov h1{font:900 clamp(26px,5vw,44px)/1.1 'Orbitron',monospace;margin-bottom:10px}
.ov .nr{color:var(--nr);text-shadow:0 0 15px rgba(255,51,85,.6)}
.ov .nc{color:var(--nc);text-shadow:0 0 15px rgba(0,240,255,.6)}
.ov p{font:400 13px/1.6 'Inter',sans-serif;color:rgba(255,255,255,.5);max-width:300px;margin:6px auto 0}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;width:100%;max-width:280px}
.rb{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:12px}
.btn{margin-top:20px;padding:14px 36px;font:700 13px/1 'Orbitron',monospace;letter-spacing:.12em;text-transform:uppercase;color:#000;background:var(--nr);border:none;border-radius:8px;cursor:pointer;box-shadow:0 0 15px rgba(255,51,85,.5);transition:transform .12s}
.btn:hover{transform:scale(1.05)}.btn:active{transform:scale(.97)}
#diff{display:flex;gap:8px;margin-bottom:12px}
.db{padding:7px 16px;font:700 10px/1 'Orbitron',monospace;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.4);background:rgba(255,51,85,.06);border:1px solid rgba(255,51,85,.2);border-radius:6px;cursor:pointer;transition:all .15s}
.db:hover,.db.a{color:#fff;background:rgba(255,51,85,.15);border-color:var(--nr);box-shadow:0 0 8px rgba(255,51,85,.3)}
</style>
</head>
<body>
<div id="hud">
  <div class="hi"><div class="hl">Hits</div><div class="hv g" id="hits">0</div></div>
  <div class="hi"><div class="hl">Misses</div><div class="hv" id="misses">0</div></div>
  <div class="hi"><div class="hl">Time</div><div class="hv c" id="timer">30</div></div>
  <div class="hi"><div class="hl">Avg RT</div><div class="hv y" id="avgrt">—</div></div>
</div>
<div id="arena"></div>
<div class="ov" id="ss">
  <h1><span class="nr">NEON</span> <span class="nc">AIM</span></h1>
  <p>Click the targets as fast as you can! Train your aim and reaction speed.</p>
  <div id="diff">
    <button class="db" data-s="50">Easy</button>
    <button class="db a" data-s="35">Medium</button>
    <button class="db" data-s="22">Hard</button>
  </div>
  <button class="btn" id="sb">START</button>
</div>
<div class="ov h" id="rs">
  <h1><span class="nc">RESULTS</span></h1>
  <div class="res">
    <div class="rb"><div class="hl">Hits</div><div class="hv g" id="r-h">0</div></div>
    <div class="rb"><div class="hl">Misses</div><div class="hv" id="r-m">0</div></div>
    <div class="rb"><div class="hl">Accuracy</div><div class="hv c" id="r-a">0%</div></div>
    <div class="rb"><div class="hl">Avg Time</div><div class="hv y" id="r-t">—</div></div>
  </div>
  <p id="r-msg"></p>
  <button class="btn" id="rb">PLAY AGAIN</button>
</div>
<script>
(()=>{
'use strict';
const arena=document.getElementById('arena');
const $hits=document.getElementById('hits'),$misses=document.getElementById('misses');
const $timer=document.getElementById('timer'),$avgrt=document.getElementById('avgrt');
const $ss=document.getElementById('ss'),$rs=document.getElementById('rs');
const COLORS=['#ff3355','#ff6b00','#b44aff','#00f0ff','#39ff14','#ffe600','#ff007f'];
const DURATION=30;
let targetSize=35,hits,misses,timeLeft,interval,reactionTimes,targetSpawnTime,activeTarget;

document.querySelectorAll('.db').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.db').forEach(x=>x.classList.remove('a'));
    b.classList.add('a');
    targetSize=parseInt(b.dataset.s);
  });
});

arena.addEventListener('pointerdown',e=>{
  if(!activeTarget)return;
  misses++;$misses.textContent=misses;
});

function spawnTarget(){
  if(activeTarget)activeTarget.remove();
  const sz=targetSize+Math.floor(Math.random()*15);
  const maxX=arena.offsetWidth-sz-10;
  const maxY=arena.offsetHeight-sz-10;
  const x=10+Math.random()*maxX;
  const y=10+Math.random()*maxY;
  const color=COLORS[Math.floor(Math.random()*COLORS.length)];
  const t=document.createElement('div');
  t.className='target';
  t.style.cssText=`width:${sz}px;height:${sz}px;left:${x}px;top:${y}px;background:radial-gradient(circle,${color} 30%,transparent 70%);box-shadow:0 0 20px ${color}80`;
  const ring=document.createElement('div');
  ring.className='ring';
  ring.style.borderColor=color;
  t.appendChild(ring);
  t.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    const rt=performance.now()-targetSpawnTime;
    reactionTimes.push(rt);
    hits++;$hits.textContent=hits;
    // Hit marker
    const hm=document.createElement('div');
    hm.className='hit-marker';
    hm.style.cssText=`left:${x+sz/2-15}px;top:${y}px;color:${color};text-shadow:0 0 8px ${color}`;
    hm.textContent=`${Math.round(rt)}ms`;
    arena.appendChild(hm);
    setTimeout(()=>hm.remove(),500);
    // Update avg
    const avg=Math.round(reactionTimes.reduce((a,b)=>a+b,0)/reactionTimes.length);
    $avgrt.textContent=avg+'ms';
    t.remove();activeTarget=null;
    if(timeLeft>0)spawnTarget();
  });
  arena.appendChild(t);
  activeTarget=t;
  targetSpawnTime=performance.now();
}

function startGame(){
  hits=0;misses=0;timeLeft=DURATION;reactionTimes=[];
  $hits.textContent=0;$misses.textContent=0;$timer.textContent=DURATION;$avgrt.textContent='—';
  arena.innerHTML='';activeTarget=null;
  $ss.classList.add('h');$rs.classList.add('h');
  spawnTarget();
  interval=setInterval(()=>{
    timeLeft--;$timer.textContent=timeLeft;
    if(timeLeft<=0){clearInterval(interval);endGame()}
  },1000);
}

function endGame(){
  if(activeTarget){activeTarget.remove();activeTarget=null}
  const acc=hits+misses>0?Math.round(hits/(hits+misses)*100):0;
  const avg=reactionTimes.length>0?Math.round(reactionTimes.reduce((a,b)=>a+b,0)/reactionTimes.length):0;
  document.getElementById('r-h').textContent=hits;
  document.getElementById('r-m').textContent=misses;
  document.getElementById('r-a').textContent=acc+'%';
  document.getElementById('r-t').textContent=avg?avg+'ms':'—';
  document.getElementById('r-msg').textContent=hits>=25?'🏆 Aimbot!':hits>=18?'🔥 Sharp shooter!':hits>=12?'💪 Good aim!':'🎯 Keep practicing!';
  $rs.classList.remove('h');
}

document.getElementById('sb').addEventListener('click',startGame);
document.getElementById('rb').addEventListener('click',startGame);
})();
</script>
</body>
</html>
