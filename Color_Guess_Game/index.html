<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Color Guess — Emo Games</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--nc:#00f0ff;--np:#b44aff;--ng:#39ff14;--nr:#ff3355;--ny:#ffe600;--bg:#080a12}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:auto;background:var(--bg)}
body{font-family:'Inter',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;user-select:none;min-height:100vh;padding:15px}
body::before{content:'';position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(180,74,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(180,74,255,.02) 1px,transparent 1px);background-size:40px 40px}
#hud{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;padding:12px 0 8px}
.hi{text-align:center}
.hl{font:600 9px/1 'Orbitron',monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:5px}
.hv{font:900 22px/1 'Orbitron',monospace;color:var(--nc);text-shadow:0 0 10px rgba(0,240,255,.5)}
.hv.g{color:var(--ng);text-shadow:0 0 10px rgba(57,255,20,.5)}
.hv.r{color:var(--nr);text-shadow:0 0 10px rgba(255,51,85,.5)}
#title{font:900 14px/1 'Orbitron',monospace;letter-spacing:.12em;color:var(--np);text-shadow:0 0 12px rgba(180,74,255,.5);text-transform:uppercase}
#mode{display:flex;gap:8px;margin:6px 0 14px}
.mb{padding:7px 16px;font:700 10px/1 'Orbitron',monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);background:rgba(180,74,255,.06);border:1px solid rgba(180,74,255,.2);border-radius:6px;cursor:pointer;transition:all .15s}
.mb:hover,.mb.a{color:#fff;background:rgba(180,74,255,.15);border-color:var(--np);box-shadow:0 0 10px rgba(180,74,255,.3)}
#color-display{width:100%;max-width:280px;aspect-ratio:1;border-radius:20px;margin:0 auto 18px;border:3px solid rgba(255,255,255,.1);box-shadow:0 0 30px rgba(0,0,0,.5);transition:background .3s}
#hex-code{font:900 28px/1 'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--nc);text-shadow:0 0 12px rgba(0,240,255,.5);text-align:center;margin-bottom:18px}
#options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;max-width:480px;margin-bottom:14px}
.opt{padding:14px 8px;font:700 13px/1 'JetBrains Mono',monospace;letter-spacing:.05em;background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.1);border-radius:10px;cursor:pointer;text-align:center;transition:all .15s;color:rgba(255,255,255,.7);-webkit-tap-highlight-color:transparent}
.opt:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.08)}
.opt.correct{border-color:var(--ng);background:rgba(57,255,20,.12);color:var(--ng);box-shadow:0 0 12px rgba(57,255,20,.3)}
.opt.wrong{border-color:var(--nr);background:rgba(255,51,85,.12);color:var(--nr);box-shadow:0 0 12px rgba(255,51,85,.3)}
#feedback{height:30px;font:700 14px/30px 'Orbitron',monospace;text-align:center;transition:opacity .2s}
.ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,5,10,.92);backdrop-filter:blur(6px);text-align:center;padding:24px;transition:opacity .3s}
.ov.h{opacity:0;pointer-events:none}
.ov h1{font:900 clamp(26px,5vw,44px)/1.1 'Orbitron',monospace;margin-bottom:10px}
.ov .nc{color:var(--nc)}.ov .np{color:var(--np)}
.ov p{font:400 13px/1.6 'Inter',sans-serif;color:rgba(255,255,255,.5);max-width:300px;margin:6px auto 0}
.ov .sl{font:700 18px/1 'Orbitron',monospace;color:var(--ng);margin-top:14px}
.btn{margin-top:20px;padding:14px 36px;font:700 13px/1 'Orbitron',monospace;letter-spacing:.12em;text-transform:uppercase;color:#000;background:var(--np);border:none;border-radius:8px;cursor:pointer;box-shadow:0 0 15px rgba(180,74,255,.5);transition:transform .12s}
.btn:hover{transform:scale(1.05)}.btn:active{transform:scale(.97)}
#ft{padding:15px 0;text-align:center;font:500 10px/1 'Inter',sans-serif;color:rgba(255,255,255,.2)}
#ft b{color:var(--np)}
</style>
</head>
<body>
<div id="hud">
  <div class="hi"><div class="hl">Score</div><div class="hv g" id="sc">0</div></div>
  <div id="title">COLOR GUESS</div>
  <div class="hi"><div class="hl">Streak</div><div class="hv" id="st">0</div></div>
</div>
<div id="mode">
  <button class="mb a" data-m="hex">HEX → Color</button>
  <button class="mb" data-m="color">Color → HEX</button>
</div>
<div id="color-display"></div>
<div id="hex-code"></div>
<div id="options"></div>
<div id="feedback"></div>
<div id="ft">Built with 🎨 by <b>Emo Games</b></div>
<script>
(()=>{
'use strict';
const $display=document.getElementById('color-display');
const $hex=document.getElementById('hex-code');
const $opts=document.getElementById('options');
const $fb=document.getElementById('feedback');
const $sc=document.getElementById('sc'),$st=document.getElementById('st');

let mode='hex',score=0,streak=0,locked=false;

document.querySelectorAll('.mb').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.mb').forEach(x=>x.classList.remove('a'));
    b.classList.add('a');
    mode=b.dataset.m;
    score=0;streak=0;$sc.textContent=0;$st.textContent=0;
    newRound();
  });
});

function randHex(){
  const r=Math.floor(Math.random()*256);
  const g=Math.floor(Math.random()*256);
  const b=Math.floor(Math.random()*256);
  return '#'+[r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('');
}

function similarColor(hex){
  // Parse
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  // Offset each channel by 30-80
  const off=()=>(Math.random()>.5?1:-1)*(30+Math.floor(Math.random()*50));
  const clamp=v=>Math.max(0,Math.min(255,v));
  return '#'+[clamp(r+off()),clamp(g+off()),clamp(b+off())].map(c=>c.toString(16).padStart(2,'0')).join('');
}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

function newRound(){
  locked=false;$fb.textContent='';$fb.style.opacity=0;
  const answer=randHex().toUpperCase();
  const wrongs=[];
  for(let i=0;i<5;i++)wrongs.push(similarColor(answer).toUpperCase());

  if(mode==='hex'){
    // Show hex code, pick the matching color
    $hex.textContent=answer;
    $hex.style.display='block';
    $display.style.display='none';
    const options=shuffle([answer,...wrongs.slice(0,5)]);
    $opts.innerHTML='';
    $opts.style.gridTemplateColumns='repeat(3,1fr)';
    options.forEach(c=>{
      const btn=document.createElement('div');
      btn.className='opt';
      btn.style.background=c;
      btn.style.height='70px';
      btn.style.border='3px solid rgba(255,255,255,.1)';
      btn.dataset.val=c;
      btn.textContent='';
      btn.addEventListener('click',()=>checkAnswer(btn,answer));
      $opts.appendChild(btn);
    });
  }else{
    // Show color, pick the matching hex
    $display.style.display='block';
    $display.style.background=answer;
    $hex.style.display='none';
    const options=shuffle([answer,...wrongs.slice(0,5)]);
    $opts.innerHTML='';
    $opts.style.gridTemplateColumns='repeat(3,1fr)';
    options.forEach(c=>{
      const btn=document.createElement('div');
      btn.className='opt';
      btn.textContent=c;
      btn.dataset.val=c;
      btn.addEventListener('click',()=>checkAnswer(btn,answer));
      $opts.appendChild(btn);
    });
  }
}

function checkAnswer(btn,answer){
  if(locked)return;
  locked=true;
  if(btn.dataset.val===answer){
    btn.classList.add('correct');
    streak++;
    const pts=10+streak*2;
    score+=pts;
    $fb.textContent=`✅ Correct! +${pts}`;
    $fb.style.color='#39ff14';
  }else{
    btn.classList.add('wrong');
    // Highlight correct
    document.querySelectorAll('.opt').forEach(o=>{if(o.dataset.val===answer)o.classList.add('correct')});
    streak=0;
    $fb.textContent='❌ Wrong!';
    $fb.style.color='#ff3355';
  }
  $fb.style.opacity=1;
  $sc.textContent=score;$st.textContent=streak;
  setTimeout(newRound,1200);
}

newRound();
})();
</script>
</body>
</html>
