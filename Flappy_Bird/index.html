<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Flappy — Emo Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --neon-orange: #ff6b00;
  --neon-cyan: #00f0ff;
  --neon-green: #39ff14;
  --bg-dark: #0b0c12;
  --glow-orange: 0 0 12px rgba(255,107,0,.6), 0 0 40px rgba(255,107,0,.2);
  --glow-cyan: 0 0 12px rgba(0,240,255,.6), 0 0 40px rgba(0,240,255,.2);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--bg-dark); }
body {
  font-family: 'Inter', sans-serif; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1;
  background-image:
    linear-gradient(rgba(255,107,0,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,107,0,.03) 1px, transparent 1px);
  background-size: 45px 45px;
}
#hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 24px;
  background: linear-gradient(180deg, rgba(11,12,18,.95), transparent);
}
.hud-left, .hud-right { display: flex; align-items: center; gap: 20px; }
.hud-label { font: 600 10px/1 'Orbitron', monospace; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.4); }
.hud-val { font: 900 22px/1 'Orbitron', monospace; color: var(--neon-orange); text-shadow: var(--glow-orange); }
.hud-val.hi { color: var(--neon-cyan); text-shadow: var(--glow-cyan); }
#hud-title { font: 900 14px/1 'Orbitron', monospace; letter-spacing: .15em; color: var(--neon-orange); text-shadow: var(--glow-orange); text-transform: uppercase; }
#arena {
  position: relative;
  border: 2px solid rgba(255,107,0,.25);
  border-radius: 8px;
  box-shadow: var(--glow-orange), inset 0 0 60px rgba(255,107,0,.02);
  background: rgba(11,12,18,.5);
}
canvas { display: block; border-radius: 6px; }
.overlay {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(6,6,14,.88); backdrop-filter: blur(8px);
  border-radius: 6px; text-align: center; padding: 24px; transition: opacity .3s;
}
.overlay.hidden { opacity: 0; pointer-events: none; }
.overlay h1 { font: 900 clamp(28px,5vw,48px)/1.1 'Orbitron', monospace; margin-bottom: 8px; }
.overlay h1 .neon-o { color: var(--neon-orange); text-shadow: var(--glow-orange); }
.overlay h1 .neon-c { color: var(--neon-cyan); text-shadow: var(--glow-cyan); }
.overlay p { font: 400 13px/1.6 'Inter', sans-serif; color: rgba(255,255,255,.55); max-width: 280px; margin: 8px auto 0; }
.overlay .score-line { font: 700 16px/1 'Orbitron', monospace; color: var(--neon-cyan); text-shadow: var(--glow-cyan); margin-top: 14px; }
.start-btn {
  margin-top: 22px; padding: 14px 36px;
  font: 700 13px/1 'Orbitron', monospace; letter-spacing: .12em; text-transform: uppercase;
  color: #000; background: var(--neon-orange); border: none; border-radius: 8px;
  cursor: pointer; box-shadow: var(--glow-orange);
  transition: transform .12s, box-shadow .2s;
}
.start-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,107,0,.8), 0 0 60px rgba(255,107,0,.3); }
.start-btn:active { transform: scale(.97); }
#footer { position: fixed; bottom: 8px; left: 0; right: 0; z-index: 20; text-align: center; font: 500 10px/1 'Inter', sans-serif; letter-spacing: .08em; color: rgba(255,255,255,.25); }
#footer b { color: var(--neon-orange); font-weight: 700; }
</style>
</head>
<body>

<div id="hud">
  <div class="hud-left">
    <div><div class="hud-label">Score</div><div class="hud-val" id="score-val">0</div></div>
    <div><div class="hud-label">Best</div><div class="hud-val hi" id="hi-val">0</div></div>
  </div>
  <div id="hud-title">NEON FLAPPY</div>
  <div class="hud-right">
    <div><div class="hud-label">Pipes</div><div class="hud-val" id="pipe-val">0</div></div>
  </div>
</div>

<div id="arena">
  <canvas id="gc"></canvas>
  <div class="overlay" id="start-screen">
    <h1><span class="neon-o">NEON</span> <span class="neon-c">FLAPPY</span></h1>
    <p>Tap, click, or press space to flap. Don't hit the pipes or floor!</p>
    <p style="margin-top:6px;color:rgba(255,255,255,.35);font-size:11px">Space / Click / Tap to fly</p>
    <button class="start-btn" id="start-btn">START GAME</button>
  </div>
  <div class="overlay hidden" id="gameover-screen">
    <h1><span class="neon-c">GAME</span> <span class="neon-o">OVER</span></h1>
    <div class="score-line" id="final-score">SCORE: 0</div>
    <p id="go-msg">Try again!</p>
    <button class="start-btn" id="retry-btn">PLAY AGAIN</button>
  </div>
</div>

<div id="footer">Built with 🐦 by <b>Emo Games</b></div>

<script>
(() => {
'use strict';

const cvs = document.getElementById('gc');
const W = 400, H = 600;
cvs.width = W; cvs.height = H;
const ctx = cvs.getContext('2d');

const $score = document.getElementById('score-val');
const $hi = document.getElementById('hi-val');
const $pipe = document.getElementById('pipe-val');
const $start = document.getElementById('start-screen');
const $over = document.getElementById('gameover-screen');
const $final = document.getElementById('final-score');
const $goMsg = document.getElementById('go-msg');

// Game constants
const GRAVITY = 0.45;
const FLAP = -7.5;
const BIRD_SIZE = 18;
const PIPE_W = 50;
const GAP = 150;
const PIPE_SPEED = 2.5;
const PIPE_INTERVAL = 100; // frames

let bird, pipes, score, highScore, frameCount, alive, particles;
highScore = parseInt(localStorage.getItem('neon_flappy_hi') || '0', 10);
$hi.textContent = highScore;

function init() {
  bird = { x: 80, y: H / 2, vy: 0, angle: 0 };
  pipes = [];
  score = 0;
  frameCount = 0;
  alive = true;
  particles = [];
  updateHUD();
}

function flap() {
  if (!alive) return;
  bird.vy = FLAP;
  // Trail particles on flap
  for (let i = 0; i < 5; i++) {
    particles.push({
      x: bird.x, y: bird.y + BIRD_SIZE / 2,
      vx: -1 - Math.random() * 2,
      vy: (Math.random() - 0.5) * 2,
      life: 1, size: 2 + Math.random() * 3,
      hue: 25 + Math.random() * 20
    });
  }
}

function spawnPipe() {
  const minY = 60;
  const maxY = H - GAP - 60;
  const topH = minY + Math.random() * (maxY - minY);
  pipes.push({
    x: W + 10,
    topH: topH,
    botY: topH + GAP,
    scored: false,
    hue: 180 + Math.random() * 40
  });
}

function tick() {
  if (!alive) return;
  frameCount++;

  // Gravity
  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.06));

  // Spawn pipes
  if (frameCount % PIPE_INTERVAL === 0) spawnPipe();

  // Move and check pipes
  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= PIPE_SPEED;

    // Score
    if (!p.scored && p.x + PIPE_W < bird.x) {
      p.scored = true;
      score++;
      // Score particles
      for (let j = 0; j < 8; j++) {
        particles.push({
          x: bird.x + BIRD_SIZE, y: bird.y,
          vx: 1 + Math.random() * 3,
          vy: (Math.random() - 0.5) * 4,
          life: 1, size: 2 + Math.random() * 3,
          hue: 160 + Math.random() * 30
        });
      }
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('neon_flappy_hi', highScore);
      }
    }

    // Collision with pipes
    if (bird.x + BIRD_SIZE > p.x && bird.x < p.x + PIPE_W) {
      if (bird.y < p.topH || bird.y + BIRD_SIZE > p.botY) {
        die(); return;
      }
    }

    // Remove offscreen pipes
    if (p.x + PIPE_W < -10) pipes.splice(i, 1);
  }

  // Floor / ceiling
  if (bird.y + BIRD_SIZE > H || bird.y < 0) {
    die(); return;
  }

  updateHUD();
}

function die() {
  alive = false;
  // Death explosion
  for (let i = 0; i < 25; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 4;
    particles.push({
      x: bird.x + BIRD_SIZE / 2, y: bird.y + BIRD_SIZE / 2,
      vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 1, size: 3 + Math.random() * 4,
      hue: Math.random() * 360
    });
  }
  setTimeout(showGameOver, 500);
}

function updateHUD() {
  $score.textContent = score;
  $hi.textContent = highScore;
  $pipe.textContent = pipes.length;
}

function showGameOver() {
  $final.textContent = `SCORE: ${score}`;
  if (score === highScore && score > 0) {
    $goMsg.textContent = '🏆 NEW HIGH SCORE!';
    $goMsg.style.color = '#ffe600';
  } else if (score >= 30) {
    $goMsg.textContent = '🔥 Legendary run!';
    $goMsg.style.color = '';
  } else if (score >= 15) {
    $goMsg.textContent = '💪 Solid game!';
    $goMsg.style.color = '';
  } else {
    $goMsg.textContent = 'Try again!';
    $goMsg.style.color = '';
  }
  $over.classList.remove('hidden');
}

function draw() {
  requestAnimationFrame(draw);
  ctx.clearRect(0, 0, W, H);

  // Background grid dots
  ctx.fillStyle = 'rgba(255,107,0,0.04)';
  for (let x = 0; x < W; x += 30) {
    for (let y = 0; y < H; y += 30) {
      ctx.fillRect(x, y, 1, 1);
    }
  }

  // Pipes
  pipes.forEach(p => {
    const pipeColor = `hsl(${p.hue}, 100%, 55%)`;
    const glowColor = `hsla(${p.hue}, 100%, 55%, 0.3)`;

    // Top pipe
    ctx.fillStyle = pipeColor;
    ctx.shadowColor = pipeColor;
    ctx.shadowBlur = 12;
    ctx.fillRect(p.x, 0, PIPE_W, p.topH);
    // Lip
    ctx.fillRect(p.x - 5, p.topH - 20, PIPE_W + 10, 20);

    // Bottom pipe
    ctx.fillRect(p.x, p.botY, PIPE_W, H - p.botY);
    // Lip
    ctx.fillRect(p.x - 5, p.botY, PIPE_W + 10, 20);
    ctx.shadowBlur = 0;
  });

  // Bird
  if (alive || particles.length > 0) {
    ctx.save();
    ctx.translate(bird.x + BIRD_SIZE / 2, bird.y + BIRD_SIZE / 2);
    ctx.rotate(bird.angle);

    // Body glow
    ctx.fillStyle = '#ff6b00';
    ctx.shadowColor = '#ff6b00';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(0, 0, BIRD_SIZE / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Eye
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(5, -3, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(6, -3, 2, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#ffe600';
    ctx.beginPath();
    ctx.moveTo(BIRD_SIZE / 2, -3);
    ctx.lineTo(BIRD_SIZE / 2 + 8, 0);
    ctx.lineTo(BIRD_SIZE / 2, 3);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.025;
    p.size *= 0.97;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue}, 100%, 60%, ${p.life})`;
    ctx.shadowColor = `hsla(${p.hue}, 100%, 60%, ${p.life * 0.5})`;
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Floor line
  ctx.strokeStyle = 'rgba(255,107,0,0.2)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, H - 1);
  ctx.lineTo(W, H - 1);
  ctx.stroke();
}

// Controls
const doFlap = (e) => {
  e.preventDefault();
  if (!$start.classList.contains('hidden') || !$over.classList.contains('hidden')) return;
  flap();
};

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (!$start.classList.contains('hidden')) startGame();
    else if (!$over.classList.contains('hidden')) startGame();
    else flap();
  }
});
cvs.addEventListener('pointerdown', doFlap);

function startGame() {
  init();
  $start.classList.add('hidden');
  $over.classList.add('hidden');
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);

// Resize
function resize() {
  const maxW = window.innerWidth - 32;
  const maxH = window.innerHeight - 100;
  const scale = Math.min(1, maxW / W, maxH / H);
  document.getElementById('arena').style.transform = `scale(${scale})`;
}
window.addEventListener('resize', resize);
resize();

// Game loop using draw + tick
function loop() {
  tick();
}
setInterval(loop, 1000 / 60);
init();
draw();
})();
</script>
</body>
</html>
