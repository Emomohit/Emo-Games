<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Memory — Emo Games</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--nc:#00f0ff;--np:#b44aff;--no:#ff6b00;--nr:#ff3355;--ng:#39ff14;--ny:#ffe600;--npk:#ff007f;--bg:#080a12}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:auto;background:var(--bg)}
body{font-family:'Inter',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;user-select:none;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(0,240,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.02) 1px,transparent 1px);background-size:40px 40px}
#hud{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;padding:18px 15px 8px}
.hl{font:600 9px/1 'Orbitron',monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:4px}
.hv{font:900 20px/1 'Orbitron',monospace;color:var(--nc);text-shadow:0 0 10px rgba(0,240,255,.5)}
.hv.p{color:var(--np);text-shadow:0 0 10px rgba(180,74,255,.5)}
.hv.y{color:var(--ny);text-shadow:0 0 10px rgba(255,230,0,.5)}
#title{font:900 15px/1 'Orbitron',monospace;letter-spacing:.12em;color:var(--nc);text-shadow:0 0 12px rgba(0,240,255,.5);text-transform:uppercase}
#diff{display:flex;gap:8px;margin:8px 0 12px}
.db{padding:7px 16px;font:700 10px/1 'Orbitron',monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);background:rgba(0,240,255,.06);border:1px solid rgba(0,240,255,.2);border-radius:6px;cursor:pointer;transition:all .15s}
.db:hover,.db.a{color:#fff;background:rgba(0,240,255,.15);border-color:var(--nc);box-shadow:0 0 10px rgba(0,240,255,.3)}
#grid{display:grid;gap:10px;padding:10px;max-width:520px;width:100%}
.card{aspect-ratio:1;background:rgba(0,240,255,.06);border:2px solid rgba(0,240,255,.15);border-radius:12px;cursor:pointer;display:grid;place-items:center;font-size:0;transition:transform .3s,background .2s,border-color .2s;transform-style:preserve-3d;-webkit-tap-highlight-color:transparent}
.card:hover:not(.flipped):not(.matched){border-color:rgba(0,240,255,.4);background:rgba(0,240,255,.1)}
.card.flipped{transform:rotateY(180deg);background:rgba(0,240,255,.12);border-color:var(--nc);font-size:clamp(28px,6vw,42px)}
.card.matched{transform:rotateY(180deg);background:rgba(57,255,20,.08);border-color:var(--ng);box-shadow:0 0 12px rgba(57,255,20,.3);font-size:clamp(28px,6vw,42px);cursor:default}
.ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,5,10,.9);backdrop-filter:blur(6px);text-align:center;padding:24px;transition:opacity .3s}
.ov.h{opacity:0;pointer-events:none}
.ov h1{font:900 clamp(26px,5vw,44px)/1.1 'Orbitron',monospace;margin-bottom:10px}
.ov .nc{color:var(--nc);text-shadow:0 0 15px rgba(0,240,255,.6)}
.ov .np{color:var(--np);text-shadow:0 0 15px rgba(180,74,255,.6)}
.ov p{font:400 13px/1.6 'Inter',sans-serif;color:rgba(255,255,255,.5);max-width:300px;margin:6px auto 0}
.ov .sl{font:700 16px/1 'Orbitron',monospace;color:var(--nc);margin-top:14px}
.btn{margin-top:20px;padding:14px 36px;font:700 13px/1 'Orbitron',monospace;letter-spacing:.12em;text-transform:uppercase;color:#000;background:var(--nc);border:none;border-radius:8px;cursor:pointer;box-shadow:0 0 15px rgba(0,240,255,.5);transition:transform .12s}
.btn:hover{transform:scale(1.05)}.btn:active{transform:scale(.97)}
#ft{padding:15px 0 20px;text-align:center;font:500 10px/1 'Inter',sans-serif;color:rgba(255,255,255,.2)}
#ft b{color:var(--nc)}
</style>
</head>
<body>
<div id="hud">
  <div><div class="hl">Moves</div><div class="hv" id="mv">0</div></div>
  <div id="title">NEON MEMORY</div>
  <div><div class="hl">Pairs</div><div class="hv p" id="pr">0/8</div></div>
</div>
<div id="diff">
  <button class="db a" data-s="4">4×4</button>
  <button class="db" data-s="5">5×4</button>
  <button class="db" data-s="6">6×4</button>
</div>
<div id="grid"></div>
<div class="ov h" id="ws">
  <h1><span class="nc">YOU</span> <span class="np">WIN!</span></h1>
  <div class="sl" id="wm">Moves: 0</div>
  <p id="wt"></p>
  <button class="btn" id="wb">PLAY AGAIN</button>
</div>
<div id="ft">Built with 🧠 by <b>Emo Games</b></div>
<script>
(()=>{
'use strict';
const EMOJIS=['🚀','🎮','💎','🔥','⚡','🌈','🎯','👾','🦊','🐉','🎸','🌙','💀','🤖','🍕','🎪','🏆','🦄','🎲','🌺','🍀','🎵','🐱','🦋'];
const grid=document.getElementById('grid');
const $mv=document.getElementById('mv'),$pr=document.getElementById('pr');
const $ws=document.getElementById('ws'),$wm=document.getElementById('wm'),$wt=document.getElementById('wt');
let cards,flipped,matched,moves,pairs,totalPairs,locked,cols;

document.querySelectorAll('.db').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.db').forEach(x=>x.classList.remove('a'));
    b.classList.add('a');
    startGame(parseInt(b.dataset.s));
  });
});
document.getElementById('wb').addEventListener('click',()=>{$ws.classList.add('h');startGame(cols)});

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}

function startGame(c){
  cols=c;
  const rows=4;
  totalPairs=(cols*rows)/2;
  const pool=shuffle([...EMOJIS]).slice(0,totalPairs);
  const deck=shuffle([...pool,...pool]);
  cards=[];flipped=[];matched=0;moves=0;locked=false;
  $mv.textContent=0;$pr.textContent=`0/${totalPairs}`;
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  grid.innerHTML='';
  deck.forEach((emoji,i)=>{
    const card=document.createElement('div');
    card.className='card';
    card.dataset.emoji=emoji;
    card.dataset.idx=i;
    card.addEventListener('click',()=>flipCard(card));
    grid.appendChild(card);
    cards.push(card);
  });
}

function flipCard(card){
  if(locked||card.classList.contains('flipped')||card.classList.contains('matched'))return;
  card.classList.add('flipped');
  card.textContent=card.dataset.emoji;
  flipped.push(card);
  if(flipped.length===2){
    moves++;$mv.textContent=moves;
    locked=true;
    const[a,b]=flipped;
    if(a.dataset.emoji===b.dataset.emoji){
      setTimeout(()=>{
        a.classList.add('matched');b.classList.add('matched');
        matched++;$pr.textContent=`${matched}/${totalPairs}`;
        flipped=[];locked=false;
        if(matched===totalPairs)win();
      },400);
    }else{
      setTimeout(()=>{
        a.classList.remove('flipped');a.textContent='';
        b.classList.remove('flipped');b.textContent='';
        flipped=[];locked=false;
      },700);
    }
  }
}

function win(){
  $wm.textContent=`Moves: ${moves}`;
  const perfect=totalPairs;
  $wt.textContent=moves<=perfect?'🏆 Perfect memory!':moves<=perfect*1.5?'🔥 Excellent!':moves<=perfect*2?'💪 Good job!':'Keep practicing!';
  setTimeout(()=>$ws.classList.remove('h'),500);
}

startGame(4);
})();
</script>
</body>
</html>
