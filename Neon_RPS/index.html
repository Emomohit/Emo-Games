<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rock Paper Scissors | Emo Games</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a1a;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Animated Grid Background */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 1000px; }
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 50px;
            margin: 30px 0;
            background: rgba(0, 255, 255, 0.1);
            padding: 20px 40px;
            border-radius: 15px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 1.2rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .score-number {
            font-size: 3rem;
            font-weight: 900;
        }

        #player-score {
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
        }

        #computer-score {
            color: #f0f;
            text-shadow: 0 0 10px #f0f;
        }

        .result-text {
            font-size: 2rem;
            height: 3rem;
            margin: 20px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .choices {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }

        .choice-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(10, 10, 20, 0.8);
            border: 3px solid rgba(0, 255, 255, 0.5);
            color: #fff;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.2), 0 0 15px rgba(0, 255, 255, 0.1);
        }

        .choice-btn:hover {
            transform: translateY(-10px) scale(1.1);
            border-color: #0ff;
            box-shadow: inset 0 0 30px rgba(0, 255, 255, 0.5), 0 0 30px rgba(0, 255, 255, 0.6);
            text-shadow: 0 0 10px #fff;
        }

        .choice-btn:active {
            transform: scale(0.95);
        }

        .battle-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            margin-bottom: 20px;
            height: 150px;
        }

        .battle-icon {
            font-size: 5rem;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .battle-icon.show {
            opacity: 1;
            transform: scale(1);
        }

        .player-icon {
            color: #0ff;
            text-shadow: 0 0 20px #0ff;
        }

        .computer-icon {
            color: #f0f;
            text-shadow: 0 0 20px #f0f;
        }

        .vs-text {
            font-size: 2rem;
            color: #fff;
            opacity: 0;
            transition: all 0.3s;
        }

        .vs-text.show {
            opacity: 1;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 5px #fff; transform: scale(1); }
            100% { text-shadow: 0 0 20px #fff; transform: scale(1.2); }
        }

        /* Emojis */
        .emoji-rock::after { content: '✊'; }
        .emoji-paper::after { content: '✋'; }
        .emoji-scissors::after { content: '✌️'; }

    </style>
</head>
<body>

    <h1>Neon RPS</h1>

    <div class="scoreboard">
        <div class="score-box">
            <span class="score-label">Player</span>
            <span class="score-number" id="player-score">0</span>
        </div>
        <div class="score-box">
            <span class="score-label">Computer</span>
            <span class="score-number" id="computer-score">0</span>
        </div>
    </div>

    <div class="battle-area">
        <div class="battle-icon player-icon" id="player-battle-icon"></div>
        <div class="vs-text" id="vs-text">VS</div>
        <div class="battle-icon computer-icon" id="computer-battle-icon"></div>
    </div>

    <div class="result-text" id="result-text">Choose your weapon!</div>

    <div class="choices">
        <button class="choice-btn emoji-rock" onclick="play('rock')"></button>
        <button class="choice-btn emoji-paper" onclick="play('paper')"></button>
        <button class="choice-btn emoji-scissors" onclick="play('scissors')"></button>
    </div>

    <script>
        const choices = ['rock', 'paper', 'scissors'];
        let playerScore = 0;
        let computerScore = 0;

        const playerScoreEl = document.getElementById('player-score');
        const computerScoreEl = document.getElementById('computer-score');
        const resultTextEl = document.getElementById('result-text');
        
        const playerBattleIcon = document.getElementById('player-battle-icon');
        const computerBattleIcon = document.getElementById('computer-battle-icon');
        const vsText = document.getElementById('vs-text');

        function play(playerChoice) {
            // Hide previous battle
            playerBattleIcon.classList.remove('show');
            computerBattleIcon.classList.remove('show');
            vsText.classList.remove('show');
            
            // Generate computer choice
            const computerChoice = choices[Math.floor(Math.random() * choices.length)];

            setTimeout(() => {
                // Update icons
                playerBattleIcon.className = `battle-icon player-icon emoji-${playerChoice} show`;
                computerBattleIcon.className = `battle-icon computer-icon emoji-${computerChoice} show`;
                vsText.classList.add('show');

                // Determine Winner
                determineWinner(playerChoice, computerChoice);
            }, 300);
        }

        function determineWinner(player, computer) {
            if (player === computer) {
                showResult("It's a Draw!", "#ff0");
                return;
            }

            const winConditions = {
                'rock': 'scissors',
                'paper': 'rock',
                'scissors': 'paper'
            };

            if (winConditions[player] === computer) {
                playerScore++;
                playerScoreEl.textContent = playerScore;
                showResult("You Win! 🏆", "#0ff");
                playerBattleIcon.style.transform = "scale(1.2)";
                computerBattleIcon.style.transform = "scale(0.8)";
            } else {
                computerScore++;
                computerScoreEl.textContent = computerScore;
                showResult("Computer Wins! 💀", "#f0f");
                playerBattleIcon.style.transform = "scale(0.8)";
                computerBattleIcon.style.transform = "scale(1.2)";
            }
        }

        function showResult(text, color) {
            resultTextEl.textContent = text;
            resultTextEl.style.color = color;
            resultTextEl.style.textShadow = `0 0 15px ${color}`;
            
            // Animation reset
            resultTextEl.style.transform = "scale(1.2)";
            setTimeout(() => {
                resultTextEl.style.transform = "scale(1)";
            }, 200);
        }
    </script>
</body>
</html>
