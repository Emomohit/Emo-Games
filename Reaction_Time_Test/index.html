<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Reaction — Emo Games</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--nc:#00f0ff;--ng:#39ff14;--nr:#ff3355;--ny:#ffe600;--np:#b44aff;--bg:#080a12}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Inter',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none}
body::before{content:'';position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(0,240,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.02) 1px,transparent 1px);background-size:40px 40px}
#zone{width:90%;max-width:600px;height:60vh;max-height:400px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:background .3s,border-color .3s;border:3px solid rgba(255,255,255,.1);text-align:center;padding:30px;-webkit-tap-highlight-color:transparent}
#zone.wait{background:rgba(255,51,85,.08);border-color:rgba(255,51,85,.3)}
#zone.ready{background:rgba(57,255,20,.1);border-color:rgba(57,255,20,.4);box-shadow:0 0 40px rgba(57,255,20,.15)}
#zone.result{background:rgba(0,240,255,.06);border-color:rgba(0,240,255,.2)}
#zone.early{background:rgba(255,230,0,.08);border-color:rgba(255,230,0,.3)}
#zone h1{font:900 clamp(22px,4vw,36px)/1.2 'Orbitron',monospace;margin-bottom:12px}
#zone p{font:400 14px/1.5 'Inter',sans-serif;color:rgba(255,255,255,.5);max-width:320px}
#zone .time{font:900 clamp(48px,10vw,80px)/1 'Orbitron',monospace;margin:15px 0}
.nc{color:var(--nc);text-shadow:0 0 15px rgba(0,240,255,.5)}
.ng{color:var(--ng);text-shadow:0 0 15px rgba(57,255,20,.5)}
.nr{color:var(--nr);text-shadow:0 0 15px rgba(255,51,85,.5)}
.ny{color:var(--ny);text-shadow:0 0 15px rgba(255,230,0,.5)}
.np{color:var(--np);text-shadow:0 0 15px rgba(180,74,255,.5)}
#stats{width:90%;max-width:600px;display:flex;justify-content:space-around;margin-top:20px}
.stat{text-align:center}
.sl{font:600 9px/1 'Orbitron',monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:5px}
.sv{font:900 20px/1 'Orbitron',monospace;color:var(--nc);text-shadow:0 0 10px rgba(0,240,255,.5)}
.sv.g{color:var(--ng);text-shadow:0 0 10px rgba(57,255,20,.5)}
.sv.p{color:var(--np);text-shadow:0 0 10px rgba(180,74,255,.5)}
#title{font:900 14px/1 'Orbitron',monospace;letter-spacing:.12em;color:var(--nc);text-shadow:0 0 12px rgba(0,240,255,.5);text-transform:uppercase;margin-bottom:18px}
#ft{position:fixed;bottom:8px;left:0;right:0;text-align:center;font:500 10px/1 'Inter',sans-serif;color:rgba(255,255,255,.2)}
#ft b{color:var(--nc)}
</style>
</head>
<body>
<div id="title">NEON REACTION</div>
<div id="zone" class="wait">
  <h1 class="nr">WAIT FOR GREEN...</h1>
  <p>Click/tap as soon as the screen turns green!</p>
</div>
<div id="stats">
  <div class="stat"><div class="sl">Best</div><div class="sv g" id="best">—</div></div>
  <div class="stat"><div class="sl">Attempts</div><div class="sv" id="att">0</div></div>
  <div class="stat"><div class="sl">Average</div><div class="sv p" id="avg">—</div></div>
</div>
<div id="ft">Built with ⚡ by <b>Emo Games</b></div>
<script>
(()=>{
'use strict';
const zone=document.getElementById('zone');
const $best=document.getElementById('best'),$att=document.getElementById('att'),$avg=document.getElementById('avg');
let state='idle',timer=null,startTime=0,times=[],bestTime=Infinity;

function setState(s){
  state=s;
  zone.className=s;
  if(s==='wait'){
    zone.innerHTML='<h1 class="nr">WAIT FOR GREEN...</h1><p>Click/tap as soon as the screen turns green!</p>';
    const delay=1500+Math.random()*4000;
    timer=setTimeout(()=>{
      setState('ready');
    },delay);
  }else if(s==='ready'){
    startTime=performance.now();
    zone.innerHTML='<h1 class="ng">CLICK NOW!</h1>';
  }else if(s==='early'){
    zone.innerHTML='<h1 class="ny">TOO EARLY! ⚠️</h1><p>Wait for green before clicking.<br>Click to try again.</p>';
  }
}

function showResult(ms){
  const rounded=Math.round(ms);
  times.push(rounded);
  if(rounded<bestTime)bestTime=rounded;
  const avgVal=Math.round(times.reduce((a,b)=>a+b,0)/times.length);
  $best.textContent=bestTime+'ms';
  $att.textContent=times.length;
  $avg.textContent=avgVal+'ms';

  let rating,cls;
  if(rounded<200){rating='🏆 Insane!';cls='ng'}
  else if(rounded<250){rating='🔥 Blazing!';cls='ng'}
  else if(rounded<350){rating='💪 Good!';cls='nc'}
  else if(rounded<500){rating='👍 Average';cls='ny'}
  else{rating='🐢 Slow';cls='nr'}

  zone.innerHTML=`<div class="time ${cls}">${rounded}<span style="font-size:.4em">ms</span></div><h1 class="${cls}">${rating}</h1><p>Click to try again</p>`;
}

zone.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='wait'){
    clearTimeout(timer);
    setState('early');
  }else if(state==='ready'){
    const elapsed=performance.now()-startTime;
    state='result';
    zone.className='result';
    showResult(elapsed);
  }else{
    // idle, result, or early — start new round
    setState('wait');
  }
});

// Start
setState('wait');
})();
</script>
</body>
</html>
