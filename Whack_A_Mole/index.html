<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Whack — Emo Games</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--nc:#00f0ff;--np:#b44aff;--no:#ff6b00;--nr:#ff3355;--ng:#39ff14;--ny:#ffe600;--bg:#080a12}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:auto;background:var(--bg)}
body{font-family:'Inter',sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;user-select:none;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(180,74,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(180,74,255,.025) 1px,transparent 1px);background-size:35px 35px}
#hud{width:100%;max-width:500px;display:flex;justify-content:space-between;align-items:center;padding:20px 15px 10px}
.hl{font:600 9px/1 'Orbitron',monospace;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:4px}
.hv{font:900 22px/1 'Orbitron',monospace;color:var(--nc);text-shadow:0 0 10px rgba(0,240,255,.5)}
.hv.r{color:var(--nr);text-shadow:0 0 10px rgba(255,51,85,.5)}
.hv.g{color:var(--ng);text-shadow:0 0 10px rgba(57,255,20,.5)}
#title{font:900 16px/1 'Orbitron',monospace;letter-spacing:.12em;color:var(--np);text-shadow:0 0 12px rgba(180,74,255,.5);text-transform:uppercase}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:20px;max-width:420px;width:100%}
.hole{position:relative;width:100%;aspect-ratio:1;background:rgba(180,74,255,.06);border:2px solid rgba(180,74,255,.15);border-radius:16px;cursor:pointer;display:grid;place-items:center;transition:border-color .15s;overflow:hidden;-webkit-tap-highlight-color:transparent}
.hole:hover{border-color:rgba(180,74,255,.35)}
.hole .mole{position:absolute;bottom:-100%;width:60%;height:60%;border-radius:50%;background:var(--np);box-shadow:0 0 15px rgba(180,74,255,.5);transition:bottom .15s ease-out;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,5vw,36px)}
.hole.active .mole{bottom:20%}
.hole.golden .mole{background:var(--ny);box-shadow:0 0 20px rgba(255,230,0,.6)}
.hole.hit{animation:hitFlash .2s}
.hit-text{position:absolute;top:20%;font:900 18px/1 'Orbitron',monospace;color:var(--ng);text-shadow:0 0 10px rgba(57,255,20,.5);animation:floatUp .6s forwards;pointer-events:none}
@keyframes hitFlash{0%{background:rgba(57,255,20,.2)}100%{background:rgba(180,74,255,.06)}}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.ov{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,5,10,.9);backdrop-filter:blur(6px);text-align:center;padding:24px;transition:opacity .3s}
.ov.h{opacity:0;pointer-events:none}
.ov h1{font:900 clamp(26px,5vw,44px)/1.1 'Orbitron',monospace;margin-bottom:10px}
.ov .nc{color:var(--nc);text-shadow:0 0 15px rgba(0,240,255,.6)}
.ov .np{color:var(--np);text-shadow:0 0 15px rgba(180,74,255,.6)}
.ov p{font:400 13px/1.6 'Inter',sans-serif;color:rgba(255,255,255,.5);max-width:300px;margin:6px auto 0}
.ov .sl{font:700 18px/1 'Orbitron',monospace;color:var(--nc);text-shadow:0 0 10px rgba(0,240,255,.5);margin-top:14px}
.btn{margin-top:20px;padding:14px 36px;font:700 13px/1 'Orbitron',monospace;letter-spacing:.12em;text-transform:uppercase;color:#000;background:var(--np);border:none;border-radius:8px;cursor:pointer;box-shadow:0 0 15px rgba(180,74,255,.5);transition:transform .12s}
.btn:hover{transform:scale(1.05)}.btn:active{transform:scale(.97)}
#ft{padding:15px 0 20px;text-align:center;font:500 10px/1 'Inter',sans-serif;color:rgba(255,255,255,.2)}
#ft b{color:var(--np)}
</style>
</head>
<body>
<div id="hud">
  <div><div class="hl">Score</div><div class="hv" id="sc">0</div></div>
  <div id="title">NEON WHACK</div>
  <div><div class="hl">Time</div><div class="hv r" id="tm">30</div></div>
</div>
<div id="grid"></div>
<div style="text-align:center;margin-top:5px"><div class="hl">Combo</div><div class="hv g" id="combo">x0</div></div>
<div class="ov" id="ss">
  <h1><span class="np">NEON</span> <span class="nc">WHACK</span></h1>
  <p>Tap the glowing moles before they hide! Golden moles = bonus points. Build combos for multipliers!</p>
  <button class="btn" id="sb">START</button>
</div>
<div class="ov h" id="os">
  <h1><span class="nc">TIME'S</span> <span class="np">UP!</span></h1>
  <div class="sl" id="fs">SCORE: 0</div>
  <p id="gm">Nice reflexes!</p>
  <button class="btn" id="rb">PLAY AGAIN</button>
</div>
<div id="ft">Built with 🔨 by <b>Emo Games</b></div>
<script>
(()=>{
'use strict';
const HOLES=9,GAME_TIME=30;
const grid=document.getElementById('grid');
const $sc=document.getElementById('sc'),$tm=document.getElementById('tm'),$combo=document.getElementById('combo');
const $ss=document.getElementById('ss'),$os=document.getElementById('os'),$fs=document.getElementById('fs'),$gm=document.getElementById('gm');
const holes=[];
let score,combo,timeLeft,playing,moleTimer,clockTimer;
let bestScore=parseInt(localStorage.getItem('neon_whack_hi')||'0',10);

// Build grid
for(let i=0;i<HOLES;i++){
  const hole=document.createElement('div');
  hole.className='hole';
  hole.innerHTML='<div class="mole">👾</div>';
  hole.addEventListener('pointerdown',e=>{e.preventDefault();whack(i)});
  grid.appendChild(hole);
  holes.push(hole);
}

function whack(i){
  if(!playing)return;
  const h=holes[i];
  if(!h.classList.contains('active'))return;
  h.classList.remove('active');
  h.classList.add('hit');
  setTimeout(()=>h.classList.remove('hit'),200);
  combo++;
  const isGold=h.classList.contains('golden');
  h.classList.remove('golden');
  const mult=Math.min(5,1+Math.floor(combo/3));
  const pts=(isGold?50:10)*mult;
  score+=pts;
  $sc.textContent=score;
  $combo.textContent=`x${mult}`;
  // Float text
  const ft=document.createElement('div');
  ft.className='hit-text';
  ft.textContent=`+${pts}`;
  if(isGold)ft.style.color='#ffe600';
  h.appendChild(ft);
  setTimeout(()=>ft.remove(),600);
}

function spawnMole(){
  if(!playing)return;
  // Clear previous
  holes.forEach(h=>{h.classList.remove('active','golden')});
  // Pick random hole
  const idx=Math.floor(Math.random()*HOLES);
  holes[idx].classList.add('active');
  // 15% chance golden
  if(Math.random()<0.15)holes[idx].classList.add('golden');
  // Auto hide
  const hideTime=Math.max(500,1200-score*2);
  clearTimeout(moleTimer);
  moleTimer=setTimeout(()=>{
    if(holes[idx].classList.contains('active')){
      holes[idx].classList.remove('active','golden');
      combo=0;$combo.textContent='x0';
    }
    if(playing)spawnMole();
  },hideTime);
}

function startGame(){
  score=0;combo=0;timeLeft=GAME_TIME;playing=true;
  $sc.textContent=0;$tm.textContent=GAME_TIME;$combo.textContent='x0';
  $ss.classList.add('h');$os.classList.add('h');
  holes.forEach(h=>{h.classList.remove('active','golden','hit')});
  spawnMole();
  clockTimer=setInterval(()=>{
    timeLeft--;$tm.textContent=timeLeft;
    if(timeLeft<=0){
      clearInterval(clockTimer);clearTimeout(moleTimer);
      playing=false;
      holes.forEach(h=>h.classList.remove('active','golden'));
      if(score>bestScore){bestScore=score;localStorage.setItem('neon_whack_hi',bestScore)}
      $fs.textContent=`SCORE: ${score}`;
      $gm.textContent=score>=500?'🏆 LEGENDARY!':score>=300?'🔥 Amazing reflexes!':score>=150?'💪 Nice game!':'Keep practicing!';
      setTimeout(()=>$os.classList.remove('h'),400);
    }
  },1000);
}
document.getElementById('sb').addEventListener('click',startGame);
document.getElementById('rb').addEventListener('click',startGame);
})();
</script>
</body>
</html>
